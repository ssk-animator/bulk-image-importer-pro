<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Bulk Image Importer Pro by SSK</title>
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/theme.css" />
  <script src="https://appsforoffice.microsoft.com/lib/beta/hosted/office.js" type="text/javascript"></script>
</head>
<body>
  <div id="app">
    <header class="app-header" role="banner">
      <img src="./assets/bulk-image-importer-pro_LOGO.png" alt="Bulk Image Importer Pro" class="app-logo-image" />
      <h1>
        Bulk Image Importer Pro
        <span class="byline">by SSK</span>
      </h1>
    </header>

    <nav class="tab-nav" role="tablist" aria-label="Main navigation">
      <button class="tab-btn active" data-tab="import" role="tab" aria-selected="true" tabindex="0">
        <span class="tab-icon">📁</span>
        <span class="tab-label">Import</span>
      </button>
      <button class="tab-btn" data-tab="layout" role="tab" aria-selected="false" tabindex="-1">
        <span class="tab-icon">🎨</span>
        <span class="tab-label">Layout</span>
      </button>
      <button class="tab-btn" data-tab="preview" role="tab" aria-selected="false" tabindex="-1">
        <span class="tab-icon">🖼️</span>
        <span class="tab-label">Preview</span>
      </button>
      <button class="tab-btn" data-tab="export" role="tab" aria-selected="false" tabindex="-1">
        <span class="tab-icon">💾</span>
        <span class="tab-label">Export</span>
      </button>
      <button class="tab-btn" data-tab="settings" role="tab" aria-selected="false" tabindex="-1">
        <span class="tab-icon">⚙️</span>
        <span class="tab-label">Settings</span>
      </button>
    </nav>

    <main class="tab-content">
      <section class="tab-panel active" id="tab-import" role="tabpanel" aria-label="Import panel">
        <div id="import-panel"></div>
      </section>
      <section class="tab-panel" id="tab-layout" role="tabpanel" aria-label="Layout panel">
        <div id="layout-panel"></div>
      </section>
      <section class="tab-panel" id="tab-preview" role="tabpanel" aria-label="Preview panel">
        <div id="preview-panel"></div>
      </section>
      <section class="tab-panel" id="tab-export" role="tabpanel" aria-label="Export panel">
        <div id="export-panel"></div>
      </section>
      <section class="tab-panel" id="tab-settings" role="tabpanel" aria-label="Settings panel">
        <div id="settings-panel"></div>
      </section>
    </main>

    <div id="progress-panel" style="padding: var(--spacing-md);"></div>
  </div>

  <script type="module" src="./taskpane.ts"></script>
</body>
</html>
